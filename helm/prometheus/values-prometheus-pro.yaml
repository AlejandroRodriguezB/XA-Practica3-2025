server:
  service:
    type: ClusterIP

  persistentVolume:
    enabled: true
    size: 5Gi

serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: 'webapi'
        metrics_path: /metrics
        static_configs:
          - targets:
              - webapi.pro:80
    rule_files:
      - /etc/config/recording_rules.yml
      - /etc/config/alerting_rules.yml
      - /etc/config/rules
      - /etc/config/alerts
  alerting_rules.yml:
    groups:
      - name: webapi-alerts
        rules:
          - alert: WebApiDown
            expr: up{job="webapi"} == 0
            for: 10s
            labels:
              severity: critical
            annotations:
              summary: "Web API appears to be down"