name: CI Pipeline WebApi

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup .NET
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # =========================
      # STEP 1 — LINT / FORMAT
      # =========================
      - name: Lint / Format check
        run: |
          dotnet format WebApi/WebApi.csproj --verify-no-changes

      # =========================
      # STEP 2 — TESTS
      # =========================
      - name: Run tests
        run: |
          dotnet test WebApi.Tests/WebApi.Tests.csproj --verbosity normal

      # =========================
      # STEP 3 — BUILD & PUSH
      # =========================
      - name: Build Docker image
        run: |
          docker build -t webapi:ci -f WebApi/Dockerfile WebApi

      - name: Simulate Docker push
        run: |
          echo "docker tag webapi:ci <dockerhub-user>/webapi:latest"
          echo "docker push <dockerhub-user>/webapi:latest"

      # =========================
      # STEP 4 — DEPLOY (SIMULADO)
      # =========================
      - name: Deploy instructions (simulated)
        run: |
          echo "=== DEPLOY DEV ==="
          echo "make setup-dev"
          echo "succesfully deployed to DEV environment"
          echo "Pro deloyment approved"
          echo "=== DEPLOY PRO ==="
          echo "make setup-dev"
